name: grabby
description: Android video and audio downloader built on yt-dlp.
publish_to: none
version: 1.1.5+7

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State management, routing
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2

  # Networking
  dio: ^5.11.1
  internet_connection_checker_plus: ^3.1.2

  # Storage
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6

  # Domain
  equatable: ^3.0.0

  # UI
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0

  # Monitoring
  sentry_flutter: ^10.1.0

  # Downloader
  permission_handler: ^13.0.2
  receive_sharing_intent: ^1.9.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  persistent_bottom_nav_bar_v2: ^6.5.0
  skeletonizer: ^3.0.0
dev_dependencies:
  sentry_dart_plugin: ^3.4.0
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.1
  flutter_gen_runner: ^5.15.0
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  pigeon: ^29.0.8
  shared_preferences_platform_interface: ^2.4.2

flutter_gen:
  output: lib/core/gen/
  integrations:
    flutter_svg: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/Bricolage/OFL.txt
    - assets/fonts/Geist/OFL.txt
    - assets/fonts/JetBrainsMono/OFL.txt
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/Bricolage/BricolageGrotesque-Bold.ttf
          weight: 700
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist/Geist-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Medium.ttf
          weight: 500

sentry:
  upload_debug_symbols: true
  upload_source_maps: false
  project: flutter
  org: defo-y6
